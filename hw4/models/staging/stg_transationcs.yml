version: 2

models:
  - name: stg_transactions
    description: "Cleaned and normalized transaction data used by analytical marts"

    columns:
      - name: transaction_time
        description: "Original transaction timestamp"
        data_tests:
          - not_null

      - name: amount
        description: "Transaction amount"
        data_tests:
          - not_null

      - name: is_fraud
        description: "Fraud indicator: 0 = legitimate, 1 = fraudulent"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: amount_bucket
        description: "Transaction amount segment generated by our custom macro"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMALL', 'MEDIUM', 'LARGE']